<style>

.logo-line,
.info-line {
    opacity: 0;

    animation:
        reveal
        0.35s
        ease-out
        forwards;
}

@keyframes reveal {

    from {
        opacity: 0;
        transform: translateX(-8px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

@media (prefers-reduced-motion: reduce) {

    .logo-line,
    .info-line {
        animation: none;
        opacity: 1;
    }

}

</style>


