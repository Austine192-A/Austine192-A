<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1150"
    height="478"
    viewBox="0 0 1150 478"
    role="img"
    aria-label="Terminal ASCII portrait of Austine Otieno"
>

<rect
    width="100%"
    height="100%"
    fill="#000000"
 />

<style>

.ascii-line {
    font-family:
        "Courier New",
        "Consolas",
        "Liberation Mono",
        monospace;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0;

    fill: #ffffff;

    white-space: pre;

    opacity: 0;

    animation:
        terminalReveal
        0.08s
        steps(1, end)
        forwards;
}

@keyframes terminalReveal {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@media (prefers-reduced-motion: reduce) {

    .ascii-line {
        animation: none;
        opacity: 1;
    }

}

</style>

