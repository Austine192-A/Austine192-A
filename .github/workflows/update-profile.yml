name: Update GitHub Profile

on:
  schedule:
    # Run once every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_contributions.py

      - name: Generate portrait
        run: |
          python scripts/generate_portrait.py

      - name: Generate neofetch card
        run: |
          python scripts/generate_neofetch.py

      - name: Check generated files
        run: |
          git status --short

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git diff --cached --quiet || git commit -m "chore: update profile visuals"

      - name: Push changes
        run: |
          git push